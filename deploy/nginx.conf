# 数据库放大镜 —— Nginx 站点配置
#
# 形态：一个 `server { }` 块，可直接放进 conf.d/ 当 drop-in 用。
#   容器里：挂到 /etc/nginx/conf.d/default.conf（Dockerfile 已经这么做了）
#   自建机：同样放 /etc/nginx/conf.d/ 下，或 include 进现有 server
#
# 只有两件事真正容易踩坑，都写在下面了：
#   1. 缓存不能"一刀切" —— 带 hash 的和不带 hash 的要分开对待
#   2. add_header 不继承 —— 某个 location 写了自己那条，server 级的就全失效
#
# 改完务必验证：nginx -t && nginx -s reload

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;   # 自建机改成实际的 dist/ 路径
    index index.html;

    charset       utf-8;
    server_tokens off;             # 不回显 nginx 版本号

    # ---------------------------- 压缩 ----------------------------
    #
    # 刻意**不**把 .sqlite / .db 加进 gzip_types：
    # 那是二进制库文件，每次请求现压一遍纯属浪费 CPU（示例库有 368KB），
    # 而且数据库文件内部的重复度低，压缩收益远不如 JS/CSS/JSON。
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # ------------------- 缓存分层（最先看这一段） -------------------
    #
    # 分层依据只有一条：**文件名里有没有内容 hash**。
    #
    #   1) /assets/**          Vite 产出带 hash（index-Dq7RKswK.js）→ 可以缓存到永远
    #   2) index.html          无 hash → 必须每次回源校验，否则发了新版用户还看旧的
    #   3) sample.sqlite       无 hash → 同上
    #      sql-wasm.wasm
    #      sample.json
    #
    # ⚠️ 最常见的事故是写一条看起来"很专业"的通配：
    #       location ~* \.(js|css|wasm)$ { expires 1y; }
    #    —— sql-wasm.wasm 放在 public/ 下，**文件名里没有 hash**。
    #    升级 sql.js 之后浏览器会一直吃缓存里那份旧 wasm，
    #    而且症状是"本机没问题、线上白屏"，非常难查。
    #    所以这里宁可啰嗦，也按"有没有 hash"分。

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # .wasm 单独一条：需要把 MIME 钉死，且必须排在下面那条组合正则**前面**
    # （nginx 的正则 location 按出现顺序匹配，先命中者胜）。
    #
    # 为什么必须钉死 MIME：浏览器用 WebAssembly.instantiateStreaming 加载时，
    # 响应头不是 application/wasm 会直接拒绝。不依赖基础镜像的 mime.types 版本，
    # 所以在这里显式声明一次 —— 只影响这一个 location，不会干扰别的扩展名。
    location ~* \.wasm$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        types { application/wasm wasm; }
    }

    # 其余无 hash 的公开资源：允许缓存，但每次都要回源校验（命中就 304，很便宜）
    location ~* \.(?:sqlite|sqlite3|db|db3|json)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # 兜底：找不到文件就回落 index.html。
    # 本站没有客户端路由（所有状态都在 ?query 里），这条只为"别人分享了
    # 一个带多余路径的链接"这种情况兜底，让页面至少能打开。
    # 注意 try_files 的最后一项会触发**内部重定向**，重新走一遍 location 匹配，
    # 所以会命中上面的 `= /index.html`，拿到 no-cache —— 这正是我们要的。
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # 静态站点不需要把错误页发往别处；保持 nginx 默认的 404 即可。
    # 但要确认：缺失的 /assets/xxx.js 返回的是 404 而不是 index.html ——
    # 否则浏览器会拿到一坨 HTML 当 JS 执行，报 "Unexpected token '<'"，
    # 比干脆 404 难查得多。上面的 location /assets/ 不做 try_files 回落，天然就是 404。
}
